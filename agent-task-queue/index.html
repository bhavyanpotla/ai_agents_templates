<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Task Queue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="glass-panel">
            <div class="header-info">
                <h1>Agent Task Queue</h1>
                <p>Monitor real-time executions and autonomous agent workflows.</p>
            </div>
            <div class="header-actions">
                <button class="btn-primary" id="pause-btn">Pause All Agents</button>
            </div>
        </header>

        <main class="queue-grid" id="task-container">
            <!-- Tasks will be injected here via JavaScript -->
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
