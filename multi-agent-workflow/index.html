<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent Workflow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="workflow-container">
        <header class="glass-panel">
            <div>
                <h1>Content Creation Pipeline</h1>
                <p>Automated workflow passing data between specialized agents.</p>
            </div>
            <button class="btn-primary" id="run-workflow-btn">Run Workflow</button>
        </header>

        <main class="canvas glass-panel">
            <div class="node-track" id="node-track">
                <!-- Workflow nodes injected via JS -->
            </div>
            
            <div class="log-panel" id="log-panel">
                <h3>Execution Logs</h3>
                <div class="logs" id="logs-container">
                    <p class="placeholder-text">Click 'Run Workflow' to start.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
